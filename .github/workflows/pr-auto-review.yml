name: PR auto-review

# Thin stub — the pipeline lives in chrischall/workflows.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# `labeled` events get their own group keyed by label name: opening a PR
# with --label fires `opened`+`labeled` back-to-back, and a shared group
# would let the labeled event displace the queued review, leaving the PR
# with no verdict and no label.
concurrency:
  group: |
    pr-auto-review-${{ github.event.pull_request.number }}${{
      github.event.action == 'labeled'
        && format('-labeled-{0}', github.event.label.name)
        || ''
    }}
  cancel-in-progress: false

jobs:
  review:
    uses: chrischall/workflows/.github/workflows/reusable-pr-auto-review.yml@main
    with:
      conventions_hint: "This is a Claude Code marketplace CATALOG, not application code. `.claude-plugin/marketplace.json` is GENERATED by `scripts/regen.py` and must never be hand-edited; it must stay canonically formatted (`json.dumps(indent=2)` + trailing newline — CI enforces this). Plugin `name`s must be unique across the catalog. Each plugin `source` is either `{source: github, repo}` for a repo-root plugin or `{source: git-subdir, url, path}` for a monorepo subpackage — the `github` source type has no `path` field. `metadata.version` is the catalog's own version (bumped only by release-please); per-plugin `version`s mirror their upstream source repos and are carried over by regen.py. Scrutinize any change to scripts/regen.py or scripts/validate.py, and any plugin source pointing at an unexpected repo."
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      release_pat: ${{ secrets.RELEASE_PAT }}
