name: regen

# Keeps the catalog from drifting behind the fleet (chrischall/fleet-audit#158).
# Rebuilds .claude-plugin/marketplace.json + the README server list from every
# chrischall repo's DEFAULT BRANCH (scripts/regen.py reads GitHub, not local
# clones) and, when anything changed, opens or updates one PR from the
# `bot/regen-catalog` branch. That PR goes through CI and auto-review like any
# other. When main is already current, a still-open regen PR is closed
# (its plugin versions are stale) -- see scripts/regen-pr.sh.
#
# This catalog is PUBLIC, so regen.py lists only PUBLIC repos: a private repo
# (unless named in regen.py's PRIVATE_ALLOWLIST, which ships empty) is never
# read, and a listed plugin whose repo went private is dropped rather than
# disclosed (chrischall/fleet-audit#1054).
#
# RELEASE_PAT (not GITHUB_TOKEN) is used because GitHub suppresses workflow
# runs for events GITHUB_TOKEN triggers, so a PR it opened would never get
# ci / pr-auto-review. It is not needed to read private repos: none are read.
# A plugin that drops out of the catalog for any other reason (repo deleted,
# archived, or manifest removed) fails the run instead of silently shrinking
# the catalog; run regen.py locally with --allow-removal if intended.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
      BRANCH: bot/regen-catalog
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate from default branches
        run: python3 scripts/regen.py

      - name: Validate
        run: python3 scripts/validate.py

      # Opens/updates the regen PR, or closes a stale one when main is current.
      - name: Open, update or close the regen PR
        run: scripts/regen-pr.sh
